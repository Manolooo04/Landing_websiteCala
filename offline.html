<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06111f">
  <title>Sin conexión | Cala Negocios e Inversiones</title>
  <style>
    :root{--navy:#06111f;--blue:#7396ba;--mist:#d9e8f3;--white:#f7f9fc}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--navy);color:var(--white);font-family:Arial,Helvetica,sans-serif}.offline-page{min-height:100vh;display:grid;place-items:center;padding:32px 6vw}.offline-inner{width:min(100%,720px);text-align:center}.offline-logo{width:170px;height:42px;object-fit:contain;background:var(--white);margin:0 auto 90px}.offline-mark{width:78px;height:78px;margin:0 auto 28px;border:2px solid var(--blue);display:grid;place-items:center;color:var(--mist);font-size:26px}.offline-inner h1{font-size:clamp(30px,5vw,58px);line-height:1;margin:0 0 18px;letter-spacing:-2px}.offline-inner p{max-width:430px;margin:0 auto 30px;color:#b9c9d8;font-size:16px;line-height:1.6}.offline-refresh{display:inline-flex;align-items:center;gap:28px;background:var(--mist);color:var(--navy);padding:15px 20px;border:0;font:700 13px Arial;cursor:pointer}.offline-refresh span{font-size:23px;font-weight:800;-webkit-text-stroke:.45px currentColor}.offline-note{margin-top:70px;color:#9fb2c6;font-size:11px;letter-spacing:1px;text-transform:uppercase}@media(max-width:700px){.offline-logo{margin-bottom:70px}}
  </style>
</head>
<body>
  <main class="offline-page"><div class="offline-inner"><img class="offline-logo" src="cala-signature.svg" alt="CALA"><div class="offline-mark" aria-hidden="true">↯</div><h1>Estamos sin conexión.</h1><p>La red no está disponible en este momento. Revisa tu conexión y vuelve a intentarlo para continuar con Cala.</p><button class="offline-refresh" type="button" onclick="location.reload()">Intentar de nuevo <span aria-hidden="true">→</span></button><p class="offline-note">Cala Negocios e Inversiones · Lima, Perú · 2026</p></div></main>
</body>
</html>
