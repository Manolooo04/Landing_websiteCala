<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06111f">
  <title>404 | Cala Negocios e Inversiones</title>
  <style>
    :root{--navy:#06111f;--blue:#7396ba;--mist:#d9e8f3;--white:#f7f9fc}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--navy);color:var(--white);font-family:Arial,Helvetica,sans-serif}.error-page{min-height:100vh;display:grid;place-items:center;padding:32px 6vw;position:relative;overflow:hidden}.error-page:before{content:"";position:absolute;width:55vw;height:55vw;border:1px solid #7396ba33;border-radius:50%;right:-20vw;top:-20vw}.error-page:after{content:"";position:absolute;width:28vw;height:28vw;border:1px solid #d9e8f322;border-radius:50%;left:-13vw;bottom:-10vw}.error-inner{width:min(100%,1080px);position:relative;z-index:1}.error-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(90px,16vh,180px)}.error-logo{width:170px;height:42px;object-fit:contain;background:var(--white)}.error-code{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:2px}.error-content{display:grid;grid-template-columns:1.1fr .9fr;gap:8vw;align-items:end}.error-number{color:var(--mist);font-size:clamp(110px,20vw,260px);line-height:.75;font-weight:700;letter-spacing:-14px;margin:0}.error-copy{border-left:2px solid var(--blue);padding-left:28px}.error-copy h1{font-size:clamp(28px,4vw,52px);line-height:1.05;margin:0 0 18px;letter-spacing:-2px}.error-copy p{max-width:390px;color:#b9c9d8;font-size:16px;line-height:1.6;margin:0 0 30px}.error-link{display:inline-flex;align-items:center;gap:28px;background:var(--mist);color:var(--navy);padding:15px 20px;font-size:13px;font-weight:700;text-decoration:none}.error-link span{font-size:23px;font-weight:800;-webkit-text-stroke:.45px currentColor}.error-footer{margin-top:72px;padding-top:18px;border-top:1px solid #7396ba55;color:#9fb2c6;font-size:11px;letter-spacing:1px;text-transform:uppercase}@media(max-width:700px){.error-page{padding:25px}.error-top{margin-bottom:100px}.error-content{display:block}.error-number{font-size:40vw;margin-bottom:55px;letter-spacing:-7px}.error-copy{padding-left:18px}.error-footer{margin-top:65px}.error-logo{width:145px}}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-inner">
      <div class="error-top"><a href="/" aria-label="Volver a Cala"><img class="error-logo" src="cala-signature.svg" alt="CALA"></a><span class="error-code">ERROR / 404</span></div>
      <div class="error-content"><p class="error-number" aria-hidden="true">404</p><div class="error-copy"><h1>Esta oportunidad todavía no existe.</h1><p>La dirección que buscas no está disponible. Regresa al inicio para continuar explorando Cala Negocios e Inversiones.</p><a class="error-link" href="/">Volver al inicio <span aria-hidden="true">→</span></a></div></div>
      <p class="error-footer">Cala Negocios e Inversiones · Lima, Perú · 2026</p>
    </div>
  </main>
</body>
</html>
